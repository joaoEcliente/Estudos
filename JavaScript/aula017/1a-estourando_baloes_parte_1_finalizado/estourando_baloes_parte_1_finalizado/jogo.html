<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Jogo</title>
</head>
<body onload="iniciarJogo()">
	<div style="float: left; width: auto; height: 500px; background: #fff; border: 1px solid #a2a2a2; margin-right: 10px;">
		<table>
			<tr>
				<td><img src="imagens/balao_azul_grande.png"></td>
				<td>
					<span id="inteiros" style="font-size: 40px;"></span>
				</td>
			</tr>
		</table>	
		
		<table>
			<tr>
				<td><img src="imagens/balao_azul_grande_estourado.png"></td>
				<td>
					<span id="estourados" style="font-size: 40px;"></span>
				</td>
			</tr>
		</table>	

		<br>
		<table style="height: 132px; width: 140px;">
			<tr>
				<td style="background: url('imagens/cronometro.png'); text-align: center;">
					<span id="tempo" style="color: red; font-size: 30px;"></span>
				</td>
			</tr>
		</table>
	</div>

	<div id="cenario" style="float: left; width: 600px; height: 500px; background: url('imagens/cenario.png'); background-position: bottom;"></div>

	<script src="index.js"></script>
</body>
</html>
