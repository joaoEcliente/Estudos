<!DOCTYPE HTML>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">

		<title>Divs</title>

		<!-- bootstrap - link cdn -->
		<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css" integrity="sha384-1q8mTJOASx8j1Au+a5WDVnPi2lkFfwwEAa8hDDdjZlpLegxhjVME1fgjWPGmkzs7" crossorigin="anonymous">

		<!-- jquery -->
		<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

		<script type="text/javascript">
			function oculta_elemento_tag(tag){
                $(tag).hide();
            } 

            function exibe_elemento_tag(tag){
                $(tag).show();
            }

            function oculta_elemento_classes(classe){
                $('.' + classe).hide();
            }

            function exibe_elemento_classes(classe){
                $('.' + classe).show();
            }

		</script>
	</head>

	<body>
		
		<div class="container">
			<div class="jumbotron">
				<h1>SELECIONANDO ELEMENTOS COM JQUERY</h1>
			</div>

			<hr />

			<div class="row">
				<div class="col-md-4">
					<h4>Parágrafos (p)</h4>
				</div>
				<div class="col-md-4">
					<h4>Divisões (div)</h4>
				</div>
				<div class="col-md-4">
					<h4>Campos (input)</h4>
				</div>
			</div>

			<div class="row">
				<div class="col-md-4">
					<p class="bg-primary">Este é um parágrafo</p>
					<p class="bg-success">Este é outro parágrafo</p>
				</div>

				<div class="col-md-4">
					<div style="height: 100px; width: 100px; background:#428bca;" class="pull-left"></div>
					<div style="height: 100px; width: 100px; background:#5cb85c; margin-left:15px" class="pull-left"></div>
				</div>

				<div class="col-md-4">
					<input type="text" class="form-control" />
					<input type="text" class="form-control" />
				</div>
			</div>

			<hr />

			<div class="row">
				<div class="col-md-4">
                    <button type="button" class="btn btn-success" onclick="exibe_elemento_tag('p')">Exibir parágrafos</button>
					<button type="button" class="btn btn-danger" onclick="oculta_elemento_tag('p')">Esconder parágrafos</button>
				</div>

				<div class="col-md-4">
					<div class="div_2">
                        <button type="button" class="btn btn-danger" onclick="oculta_elemento_classes('div_2')" >Esconder divs</button>
                    </div>
					<button type="button" class="btn btn-success" onclick="exibe_elemento_classes('div_2')">Exibir divs</button>
				</div>

				<div class="col-md-4">
					<button type="button" class="btn btn-danger" onclick="oculta_elemento_tag('input')" >Esconder inputs</button>
					<button type="button" class="btn btn-success" onclick="exibe_elemento_tag('input')" >Exibir inputs</button>
				</div>

			</div>
			
		</div>
	</body>
</html>
